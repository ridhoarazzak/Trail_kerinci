<!-- ============================================================
  SECTION PROFIL ELEVASI — tempel sebelum </body> di index.html
  (setelah script yang membuat peta). Yang perlu Anda sesuaikan
  ada di blok "KONFIGURASI" paling bawah.
============================================================= -->

<style>
  :root { --nav-h: 64px; }              /* tinggi bar bawah (Peta/Pos/Info/Darurat) */

  #profil-toggle {
    position: fixed; left: 12px; z-index: 900;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border: 0; border-radius: 999px;
    background: #14532d; color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .25); cursor: pointer;
  }
  #profil-toggle svg { width: 18px; height: 18px; }
  body.profil-open #profil-toggle { display: none; }

  #profil-sheet {
    position: fixed; left: 0; right: 0; z-index: 950;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    max-width: 640px; margin: 0 auto;
    background: #fbfbf8; border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 18px rgba(0, 0, 0, .22);
    transform: translateY(110%); transition: transform .22s ease;
  }
  body.profil-open #profil-sheet { transform: none; }
  @media (prefers-reduced-motion: reduce) { #profil-sheet { transition: none; } }

  #profil-sheet .sheet-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px 0; font-size: 14px; font-weight: 650; color: #14301f;
  }
  #profil-sheet .sheet-close {
    border: 0; background: #e9ede6; color: #14301f; width: 30px; height: 30px;
    border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer;
  }
  #profil-sheet .kep { border-radius: 0; padding-top: 6px; }
</style>

<button id="profil-toggle" type="button" aria-controls="profil-sheet">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 18l5-8 4 5 3-4 6 7z"/>
  </svg>
  Profil elevasi
</button>

<section id="profil-sheet" aria-label="Profil elevasi jalur">
  <div class="sheet-bar">
    <span>Profil elevasi</span>
    <button class="sheet-close" type="button" aria-label="Tutup profil elevasi">×</button>
  </div>
  <div id="profil"></div>
</section>

<script src="elevation-profile.js"></script>
<script>
(function () {
  /* ================= KONFIGURASI ================= */
  var MAP_LIB  = 'leaflet';                 // 'leaflet' atau 'maplibre'
  var getMap   = function () { return window.map; };   // ganti jika variabel peta Anda bernama lain
  var GPX_URL  = 'data/jalur_trail_kerinci_fress.gpx';
  /* ============================================== */

  var marker = null, mounted = false;

  function showMarker(p) {
    var map = getMap();
    if (!map) return;
    if (MAP_LIB === 'leaflet') {
      if (!marker) marker = L.circleMarker([p.lat, p.lon], {
        radius: 9, color: '#14301f', weight: 3, fillColor: '#fff', fillOpacity: 1, interactive: false
      }).addTo(map);
      else marker.setLatLng([p.lat, p.lon]);
    } else {
      if (!marker) {
        var el = document.createElement('div');
        el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #14301f';
        marker = new maplibregl.Marker({ element: el }).setLngLat([p.lon, p.lat]).addTo(map);
      } else marker.setLngLat([p.lon, p.lat]);
    }
  }
  function hideMarker() {
    if (!marker) return;
    if (MAP_LIB === 'leaflet') marker.remove(); else marker.remove();
    marker = null;
  }

  function open() {
    document.body.classList.add('profil-open');
    if (!mounted) {                       // dimuat saat pertama dibuka, hemat kuota
      mounted = true;
      KerinciElevation.mount({
        container: '#profil', gpxUrl: GPX_URL,
        onHover: showMarker, onLeave: hideMarker
      });
    }
  }
  function close() { document.body.classList.remove('profil-open'); hideMarker(); }

  document.getElementById('profil-toggle').addEventListener('click', open);
  document.querySelector('#profil-sheet .sheet-close').addEventListener('click', close);
})();
</script>
